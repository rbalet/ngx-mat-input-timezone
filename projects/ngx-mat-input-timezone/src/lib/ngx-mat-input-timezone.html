<button
  type="button"
  class="timezone-selector"
  (click)="openTimezoneDialog()"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
>
  <span class="timezone-selector-label" [class.placeholder]="!selectedTimezoneLabel">
    {{ selectedTimezoneLabel || placeholder || "Select timezone" }}
  </span>
</button>
